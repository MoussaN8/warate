<nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 z-50 px-6 py-2 md:hidden">
  <div class="flex justify-around items-center max-w-md mx-auto">
    
    <!-- Accueil -->
    <button 
      routerLink="/Accueil"
      routerLinkActive="active"
      #rlaAccueil="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [ngClass]="rlaAccueil.isActive ? 'text-emerald-400' : 'text-slate-400'"
      class="flex flex-col items-center gap-1 transition">
      <i class="pi pi-home text-lg"></i>
      <span class="text-[10px] font-medium">Accueil</span>
    </button>

    <!-- Favoris -->
    <button 
      routerLink="/Favoris"
      routerLinkActive="active"
      #rlaFavoris="routerLinkActive"
      [ngClass]="rlaFavoris.isActive ? 'text-emerald-400' : 'text-slate-400'"
      class="flex flex-col items-center gap-1 transition">
      <i class="pi pi-heart text-lg"></i>
      <span class="text-[10px] font-medium">Favoris</span>
    </button>

    <!-- Hors-ligne -->
    <button 
      routerLink="/Hors-ligne"
      routerLinkActive="active"
      #rlaHorsLigne="routerLinkActive"
      [ngClass]="rlaHorsLigne.isActive ? 'text-emerald-400' : 'text-slate-400'"
      class="flex flex-col items-center gap-1 transition relative">
      <i class="pi pi-download text-lg"></i>
      <span class="text-[10px] font-medium">Hors-ligne</span>
    </button>

  </div>
</nav>
